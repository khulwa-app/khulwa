<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khulwa Phase 0 Motion Review</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090a0c;
        color: #f4f2ed;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #090a0c;
      }
      main { flex: 0 1 960px; width: 960px; max-width: calc(100vw - 48px); }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 42px); letter-spacing: -.04em; }
      p { color: #a5a7ad; line-height: 1.55; }
      .stage {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 28px;
        background: #0d0f12;
        box-shadow: 0 32px 90px rgb(0 0 0 / 42%);
      }
      .mode {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition:
          opacity 210ms cubic-bezier(.16, 1, .3, 1),
          transform 230ms cubic-bezier(.16, 1, .3, 1);
      }
      .mode[data-active="true"] {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .content { text-align: center; }
      .eyebrow { margin: 0 0 14px; color: #a5a7ad; font-weight: 600; }
      .clock {
        margin: 0;
        font-size: clamp(84px, 14vw, 150px);
        font-weight: 600;
        line-height: .9;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
      }
      .date { margin-top: 20px; font-size: 13px; letter-spacing: .18em; }
      .task {
        margin: 38px auto 0;
        width: min(360px, 100%);
        padding: 16px 18px;
        text-align: start;
        border: 1px solid #292c31;
        border-radius: 16px;
        background: #15171b;
      }
      .task small { display: block; color: #74777f; margin-bottom: 5px; }
      .timer {
        font-size: clamp(86px, 14vw, 148px);
        font-weight: 550;
        line-height: .9;
        letter-spacing: -.06em;
        font-variant-numeric: tabular-nums;
      }
      .primary {
        margin-top: 38px;
        min-width: 160px;
        min-height: 52px;
        border: 0;
        border-radius: 999px;
        background: #e9e6df;
        color: #101114;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }
      .primary:hover { background: #f4f2ed; }
      .primary:active { transform: scale(.97); }
      nav {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 18px;
        background: #111316;
      }
      nav button {
        min-width: 92px;
        min-height: 42px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: #8f929a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button[aria-pressed="true"] { background: #25282d; color: #f4f2ed; }
      @media (max-width: 520px) {
        body { padding: 0; }
        main {
          flex: 0 0 100vw;
          width: 100vw;
          max-width: none;
          min-height: 100vh;
          min-height: 100dvh;
        }
        header { padding: 20px; margin: 0; }
        header p { display: none; }
        .stage { min-height: calc(100dvh - 86px); border-radius: 24px 24px 0 0; }
        nav { width: calc(100% - 24px); justify-content: stretch; }
        nav button { flex: 1; min-width: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mode { transform: none; transition-duration: 100ms; }
        .primary { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Spatial continuity prototype</h1>
          <p>Compare Home and Focus without exposing a blank document frame.</p>
        </div>
      </header>
      <section class="stage">
        <article class="mode" data-mode="home" data-active="true">
          <div class="content">
            <p class="eyebrow">Good evening, Saif</p>
            <p class="clock">8:30</p>
            <p class="date">MONDAY · JULY 27</p>
            <div class="task">
              <small>YOUR ONE THING</small>
              <strong>Finish the redesign brief</strong>
            </div>
          </div>
        </article>
        <article class="mode" data-mode="focus" data-active="false">
          <div class="content">
            <p class="eyebrow">Focus · Round 1 of 4</p>
            <div class="timer">25:00</div>
            <div class="task">
              <small>FOCUSING ON</small>
              <strong>Finish the redesign brief</strong>
            </div>
            <button class="primary" type="button">Begin focus</button>
          </div>
        </article>
        <nav aria-label="Mode preview">
          <button type="button" data-target="home" aria-pressed="true">Home</button>
          <button type="button" data-target="focus" aria-pressed="false">Focus</button>
          <button type="button" disabled>Ambient</button>
        </nav>
      </section>
    </main>
    <script>
      const buttons = document.querySelectorAll("[data-target]");
      const modes = document.querySelectorAll("[data-mode]");
      for (const button of buttons) {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          for (const mode of modes) mode.dataset.active = String(mode.dataset.mode === target);
          for (const item of buttons) item.setAttribute("aria-pressed", String(item === button));
        });
      }
    </script>
  </body>
</html>
