<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khulwa Phase 0 Motion Review</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #edf3eb;
        color: #1a4722;
        --sage-100: #d5e3d5;
        --sage-200: #b7d1b1;
        --sage-300: #9bc09a;
        --sage-400: #7da87a;
        --sage-500: #5a8f5b;
        --sage-600: #4e7d4f;
        --sage-700: #3c6b3e;
        --sage-800: #2b5930;
        --sage-900: #1a4722;
        --sage-1000: #0b3515;
        --canvas: #edf3eb;
        --surface: var(--sage-100);
        --elevated: #fbfdf9;
        --border: var(--sage-300);
        --ink: var(--sage-1000);
        --on-ink: #f7fbf5;
        --text: var(--sage-900);
        --text-secondary: var(--sage-800);
        --text-muted: var(--sage-700);
        --selected: var(--sage-200);
        --accent: var(--sage-700);
        --focus: var(--sage-500);
        --shadow: rgb(11 53 21 / 13%);
      }
      body[data-palette="alabaster"] {
        --canvas: #f3f0e9;
        --surface: #faf8f3;
        --elevated: #ffffff;
        --border: #d9d4c9;
        --ink: #24231f;
        --on-ink: #f8f5ee;
        --text: #1c1b18;
        --text-secondary: #5f5b54;
        --text-muted: #706b63;
        --selected: #e9e4d9;
        --accent: #8b6f47;
        --focus: #8b6f47;
        --shadow: rgb(63 55 43 / 13%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
        background: var(--canvas);
      }
      main { flex: 0 1 960px; width: 960px; max-width: calc(100vw - 48px); }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 42px); letter-spacing: -.04em; }
      p { color: var(--text-secondary); line-height: 1.55; }
      .palette-switcher {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--elevated);
      }
      .palette-switcher button {
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        color: var(--text-secondary);
        background: transparent;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }
      .palette-switcher button[aria-pressed="true"] {
        color: var(--on-ink);
        background: var(--ink);
      }
      .stage {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 32px 90px var(--shadow);
      }
      .mode {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition:
          opacity 210ms cubic-bezier(.16, 1, .3, 1),
          transform 230ms cubic-bezier(.16, 1, .3, 1);
      }
      .mode[data-active="true"] {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .content { text-align: center; }
      .eyebrow { margin: 0 0 14px; color: var(--text-secondary); font-weight: 600; }
      .clock {
        margin: 0;
        color: var(--text);
        font-size: clamp(84px, 14vw, 150px);
        font-weight: 600;
        line-height: .9;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
      }
      .date { margin-top: 20px; font-size: 13px; letter-spacing: .18em; }
      .task {
        margin: 38px auto 0;
        width: min(360px, 100%);
        padding: 16px 18px;
        text-align: start;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--elevated);
        box-shadow: 0 14px 34px var(--shadow);
      }
      .task small {
        display: block;
        margin-bottom: 5px;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: .06em;
      }
      .mode[data-mode="focus"] .task { border-color: var(--focus); }
      .timer {
        color: var(--text);
        font-size: clamp(86px, 14vw, 148px);
        font-weight: 550;
        line-height: .9;
        letter-spacing: -.06em;
        font-variant-numeric: tabular-nums;
      }
      .primary {
        margin-top: 38px;
        min-width: 160px;
        min-height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--on-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }
      .primary:hover { filter: brightness(1.12); }
      .primary:active { transform: scale(.97); }
      nav {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--elevated);
        box-shadow: 0 14px 36px var(--shadow);
      }
      nav button {
        min-width: 92px;
        min-height: 42px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        color: var(--text);
        background: var(--selected);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (max-width: 520px) {
        body { padding: 0; }
        main {
          flex: 0 0 100vw;
          display: grid;
          grid-template-rows: auto minmax(0, 1fr);
          width: 100vw;
          max-width: none;
          min-height: 100vh;
          min-height: 100dvh;
        }
        header { align-items: center; padding: 16px 20px; margin: 0; }
        h1 { font-size: 22px; line-height: 1.05; }
        header p { display: none; }
        .palette-switcher button { min-height: 40px; padding: 0 10px; font-size: 12px; }
        .stage { min-height: 0; height: 100%; border-radius: 24px 24px 0 0; }
        nav { width: calc(100% - 24px); justify-content: stretch; }
        nav button { flex: 1; min-width: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mode { transform: none; transition-duration: 100ms; }
        .primary { transition: none; }
      }
    </style>
  </head>
  <body data-palette="sage">
    <main>
      <header>
        <div>
          <h1>Spatial continuity prototype</h1>
          <p>Compare Home and Focus without exposing a blank document frame.</p>
        </div>
        <div class="palette-switcher" aria-label="Color direction">
          <button type="button" data-palette-target="sage" aria-pressed="true">
            Sage
          </button>
          <button type="button" data-palette-target="alabaster" aria-pressed="false">
            Alabaster
          </button>
        </div>
      </header>
      <section class="stage">
        <article class="mode" data-mode="home" data-active="true">
          <div class="content">
            <p class="eyebrow">Good evening, Saif</p>
            <p class="clock">8:30</p>
            <p class="date">MONDAY · JULY 27</p>
            <div class="task">
              <small>YOUR ONE THING</small>
              <strong>Finish the redesign brief</strong>
            </div>
          </div>
        </article>
        <article class="mode" data-mode="focus" data-active="false">
          <div class="content">
            <p class="eyebrow">Focus · Round 1 of 4</p>
            <div class="timer">25:00</div>
            <div class="task">
              <small>FOCUSING ON</small>
              <strong>Finish the redesign brief</strong>
            </div>
            <button class="primary" type="button">Begin focus</button>
          </div>
        </article>
        <nav aria-label="Mode preview">
          <button type="button" data-target="home" aria-pressed="true">Home</button>
          <button type="button" data-target="focus" aria-pressed="false">Focus</button>
          <button type="button" disabled>Ambient</button>
        </nav>
      </section>
    </main>
    <script>
      const buttons = document.querySelectorAll("[data-target]");
      const modes = document.querySelectorAll("[data-mode]");
      const paletteButtons = document.querySelectorAll("[data-palette-target]");
      for (const button of buttons) {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          for (const mode of modes) mode.dataset.active = String(mode.dataset.mode === target);
          for (const item of buttons) item.setAttribute("aria-pressed", String(item === button));
        });
      }
      for (const button of paletteButtons) {
        button.addEventListener("click", () => {
          document.body.dataset.palette = button.dataset.paletteTarget;
          for (const item of paletteButtons) {
            item.setAttribute("aria-pressed", String(item === button));
          }
        });
      }
    </script>
  </body>
</html>
