<svg width="1424" height="904" viewBox="0 0 712 452" xmlns="http://www.w3.org/2000/svg" font-family="'Nunito','Varela Round','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <!-- subtle top sheen on the glass surface (localized gloss, not a background gradient) -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBBAF2" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#A78FD8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8E76C8" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- flat deep indigo backdrop -->
  <rect width="712" height="452" fill="#2B1E4D"/>

  <!-- ============ Pure-glass pill (×4), matching the reference ============ -->

  <!-- +1 min -->
  <g>
    <rect x="46" y="62" width="308" height="78" rx="39" fill="#B9A4E8" opacity="0.20" filter="url(#glow)"/>
    <rect x="50" y="66" width="300" height="70" rx="35" fill="url(#sheen)"/>
    <rect x="50" y="66" width="300" height="70" rx="35" fill="none" stroke="#CFBEF6" stroke-opacity="0.55" stroke-width="1.25"/>
    <rect x="58" y="69" width="284" height="2" rx="1" fill="#FFFFFF" opacity="0.28"/>
    <text x="78" y="100" font-size="13" font-weight="800" fill="#C9B8F0"><tspan font-size="11" dy="-7">z</tspan><tspan font-size="16" dy="7">Z</tspan><tspan font-size="11" dy="-7">z</tspan></text>
    <text x="124" y="110" font-size="28" font-weight="800" fill="#FFFFFF">+ 1 min</text>
  </g>

  <!-- +5 min -->
  <g>
    <rect x="46" y="154" width="308" height="78" rx="39" fill="#B9A4E8" opacity="0.20" filter="url(#glow)"/>
    <rect x="50" y="158" width="300" height="70" rx="35" fill="url(#sheen)"/>
    <rect x="50" y="158" width="300" height="70" rx="35" fill="none" stroke="#CFBEF6" stroke-opacity="0.55" stroke-width="1.25"/>
    <rect x="58" y="161" width="284" height="2" rx="1" fill="#FFFFFF" opacity="0.28"/>
    <text x="78" y="192" font-size="13" font-weight="800" fill="#C9B8F0"><tspan font-size="11" dy="-7">z</tspan><tspan font-size="16" dy="7">Z</tspan><tspan font-size="11" dy="-7">z</tspan></text>
    <text x="124" y="202" font-size="28" font-weight="800" fill="#FFFFFF">+ 5 min</text>
  </g>

  <!-- Skip Break -->
  <g>
    <rect x="46" y="246" width="320" height="80" rx="40" fill="#B9A4E8" opacity="0.20" filter="url(#glow)"/>
    <rect x="50" y="250" width="312" height="72" rx="36" fill="url(#sheen)"/>
    <rect x="50" y="250" width="312" height="72" rx="36" fill="none" stroke="#CFBEF6" stroke-opacity="0.55" stroke-width="1.25"/>
    <rect x="58" y="253" width="296" height="2" rx="1" fill="#FFFFFF" opacity="0.28"/>
    <path d="M82 277 l13 9 l-13 9 M99 277 l13 9 l-13 9" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="296" font-size="28" font-weight="800" fill="#FFFFFF">Skip Break</text>
  </g>

  <!-- Lock Screen -->
  <g>
    <rect x="384" y="246" width="300" height="80" rx="40" fill="#B9A4E8" opacity="0.20" filter="url(#glow)"/>
    <rect x="388" y="250" width="292" height="72" rx="36" fill="url(#sheen)"/>
    <rect x="388" y="250" width="292" height="72" rx="36" fill="none" stroke="#CFBEF6" stroke-opacity="0.55" stroke-width="1.25"/>
    <rect x="396" y="253" width="276" height="2" rx="1" fill="#FFFFFF" opacity="0.28"/>
    <rect x="420" y="280" width="22" height="17" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
    <path d="M424 280 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <text x="458" y="296" font-size="28" font-weight="800" fill="#FFFFFF">Lock Screen</text>
  </g>

  <!-- footer: Press [Esc] twice to skip the break -->
  <text x="148" y="384" font-size="21" font-weight="700" fill="#B9A6DE" opacity="0.85">Press</text>
  <rect x="224" y="365" width="58" height="32" rx="9" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.1"/>
  <text x="253" y="387" text-anchor="middle" font-size="19" font-weight="800" fill="#D8CCF2">Esc</text>
  <text x="296" y="384" font-size="21" font-weight="700" fill="#B9A6DE" opacity="0.85">twice to skip the break</text>
</svg>
